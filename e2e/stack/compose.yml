# Self-contained Parachute e2e stack.
#
# NOTHING here touches the host's Parachute. No bind mount into ~/.parachute,
# no host tokens, no host ports for the live services. Vaults are scratch:
# created on first boot, gone with `docker compose down -v`.
#
# Images are built by `run.sh` rather than by compose, because the Dockerfiles
# live here in the harness while the build CONTEXT is a module checkout (or a
# git worktree of one). Compose's `dockerfile:` is resolved relative to the
# context, which can't express that; `docker build -f <here> <there>` can.
#
# Two services, one origin: Caddy fronts the app and proxies /vault/* to the
# vault, so the browser sees a single-origin install — the shape self-hosted
# Parachute actually ships, and one with no CORS in the way.
#
# A THIRD service, `hub`, is deliberately NOT behind that Caddy. The hub is its
# own origin (`http://hub:1939`) because the Nostr key door binds the signed
# event's `u` tag to an origin the hub itself answers on, and because the hub's
# own paths (/login, /admin, /api, /oauth) would collide with the app's SPA
# routes if both were mounted at one origin. The door spec is the only spec
# that talks to it; the other specs never notice it is there.

name: parachute-e2e

services:
  vault:
    image: ${E2E_VAULT_IMAGE:-parachute-vault:e2e-fixed}
    environment:
      # Auto-create a scratch vault on first boot; without this the server
      # comes up with no vaults at all and every route 404s.
      PARACHUTE_VAULT_NAME: demo
      # Server-wide bearer. A FIXTURE, not a secret: it only ever
      # authenticates against a throwaway vault inside this stack. Using it
      # is what lets the harness skip hub entirely — no OAuth, no issuer
      # trust to configure, no second service to keep alive.
      VAULT_AUTH_TOKEN: ${E2E_VAULT_TOKEN:-e2e-scratch-token-not-a-secret}
      TRANSCRIPTION_PROVIDER: whisper-cpp
      TRANSCRIPTION_MODEL: whisper-tiny.en
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1940/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # The hub, for the Nostr key door only (specs/nostr-key-door.spec.ts).
  #
  # Built by run.sh from a parachute-hub CHECKOUT using the hub repo's own
  # `Dockerfile` — the real deployment artifact, not a harness-local one. The
  # door (hub#949/#951), `GET /login/2fa`, `parachute auth link-pubkey` and
  # `PARACHUTE_NOSTR_LOGIN_2FA` all land on hub `next` and are in no published
  # npm release, so building from a ref is the only way to test them at all.
  hub:
    image: ${E2E_HUB_IMAGE:-parachute-hub:e2e}
    environment:
      # LOAD-BEARING. `linkageBoundOrigins` deliberately DROPS a Host-derived
      # issuer (hub#833 MEDIUM-1), so without this the only bound origins are
      # the loopback aliases and every signed `u` tag naming `http://hub:1939`
      # is refused as `invalid_event`. Setting it makes the issuer env-sourced,
      # which is trusted, and the browser, the event template and the verify
      # check then all name the same origin.
      PARACHUTE_HUB_ORIGIN: http://hub:1939
      # First-boot admin seed. FIXTURES on a throwaway hub whose DB lives in an
      # anonymous volume destroyed by `docker compose down -v`. Not "admin":
      # that username is waived past the reserved-word check but is flagged
      # unlinkable for the pubkey ceremony, which is the whole subject here.
      PARACHUTE_INITIAL_ADMIN_USERNAME: ${E2E_HUB_USER:-keyholder}
      PARACHUTE_INITIAL_ADMIN_PASSWORD: e2e-scratch-password-not-a-secret
      # The seeded admin enrolls no TOTP, so the divert would never fire — this
      # is set anyway so the spec is proving the key door and not accidentally
      # depending on the absence of an enrollment. `off` is the ONLY spelling
      # that disables it.
      PARACHUTE_NOSTR_LOGIN_2FA: "off"
    healthcheck:
      # busybox wget, not curl: the hub image is alpine and ships neither curl
      # nor a shell healthcheck helper.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1939/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  app:
    image: ${E2E_APP_IMAGE:-parachute-app:e2e}
    ports:
      # Deliberately NOT 1939/1940/1944 — those are the host's live Parachute.
      - "${E2E_APP_PORT:-18080}:8080"
    depends_on:
      vault:
        condition: service_healthy
